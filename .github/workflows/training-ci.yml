name: training-ci

on:
  pull_request:
    paths:
      - "training/**"
      - ".github/workflows/training-ci.yml"
  push:
    branches:
      - main
    paths:
      - "training/**"
      - ".github/workflows/training-ci.yml"

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements-train-test.txt
      - name: 학습 파이프라인 테스트 의존성 설치
        run: python -m pip install --requirement requirements-train-test.txt
      - name: 학습 파이프라인 스모크 테스트
        run: python -m unittest discover -s tests -t .
