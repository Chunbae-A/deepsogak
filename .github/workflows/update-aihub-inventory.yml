name: Update AI-Hub dataset inventory

on:
  workflow_dispatch:
    inputs:
      dataset_key:
        description: "AI-Hub datasetkey (기본: 55 = 딥페이크 변조영상/KoDF)"
        default: "55"
        required: false
  schedule:
    - cron: "0 18 * * 1" # 매주 월요일 03:00 KST — AI-Hub 쪽 구성이 바뀌었는지 정기 확인

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch AI-Hub file tree (no API key required — public listing)
        run: |
          python scripts/aihub_inventory.py \
            --dataset-key "${{ github.event.inputs.dataset_key || '55' }}"

      - name: Commit inventory changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/inventory/
          git diff --cached --quiet || git commit -m "Update AI-Hub dataset inventory [automated]"
          git push
