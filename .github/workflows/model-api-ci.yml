name: model-api-ci

on:
  pull_request:
    paths:
      - "services/faceguard-model-api/**"
      - ".github/workflows/model-api-ci.yml"
  push:
    branches:
      - main
    paths:
      - "services/faceguard-model-api/**"
      - ".github/workflows/model-api-ci.yml"

permissions:
  contents: read

concurrency:
  group: model-api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/faceguard-model-api
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/faceguard-model-api/requirements-api-test.txt

      - name: 테스트 의존성 설치
        run: python -m pip install --requirement requirements-api-test.txt

      - name: 모델 API 단위 테스트
        run: python -m unittest discover -s tests
