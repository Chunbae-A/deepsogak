# tests/test_smoke_pipeline.py가 쓰는 설정. 합성 데이터로 CPU에서 60초 내에
# 전체 체인(매니페스트→정렬→학습→평가→변환→검증→보정)이 기계적으로 동작하는지만 확인한다.
# 여기서 나오는 지표는 의미 없는 숫자다 — default.yaml의 gate 기준을 절대 못 넘도록
# min_val_video_groups를 일부러 높게 둬서 display_approved=false가 항상 나오게 한다.

data_root: ../data
run_dir: runs/smoke

model:
  arch: tf_efficientnet_b4
  pretrained: false           # 네트워크 다운로드 없이 CI에서 즉시 실행되도록
  num_classes: 1
  aligned_face_size: 224
  input_size: 380

train:
  epochs: 1
  batch_size: 4
  lr: 0.001
  weight_decay: 0.0
  num_workers: 0
  seed: 0
  val_fraction: 0.3

video:
  frame_count: 16
  minimum_valid_frames: 4

gate:
  min_auc: 0.93
  min_recall_at_threshold: 0.85
  min_val_video_groups: 30    # 합성 데이터는 이 조건을 못 채워 항상 display_approved=false

datasets:
  train: [ffpp, celebdf, kodf]
  test: [kodf, deeperforensics, self_check]
